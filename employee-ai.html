<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andalus AI — الموظفين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#f3f5fa;font-family:Cairo,Arial,sans-serif;color:#172033}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#152238,#243b68);color:#fff;border-radius:20px;padding:24px;display:flex;justify-content:space-between;gap:15px;align-items:center}.hero h1{margin:0}.hero p{margin:5px 0;color:#dbe5f5}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;margin-top:16px;overflow:hidden}.quick{padding:15px;display:flex;gap:8px;flex-wrap:wrap}.quick button{border:1px solid #e2e8f0;background:#f8fafc;border-radius:10px;padding:9px 12px;font-family:inherit;font-weight:700;cursor:pointer}.messages{height:55vh;min-height:360px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 15px;border-radius:14px;line-height:1.9;white-space:pre-wrap}.user{align-self:flex-start;background:#152238;color:#fff}.ai{align-self:flex-end;background:#eef2f7}.system{align-self:center;background:#fff8e8;border:1px solid #f3dfad;font-size:12px}.composer{padding:14px;border-top:1px solid #e2e8f0;display:flex;gap:10px}.composer textarea{flex:1;min-height:55px;border:1px solid #d8dee8;border-radius:12px;padding:10px;font-family:inherit}.send{width:110px;border:0;border-radius:12px;background:#c9a24c;font-weight:900;cursor:pointer}.err{display:none;margin:12px;padding:10px;background:#fef2f2;color:#b91c1c;border-radius:10px}@media(max-width:650px){.composer{flex-direction:column}.send{width:100%;height:45px}}
</style></head><body><div class="wrap"><div class="hero"><div><h1>🧠 Andalus AI</h1><p>المساعد الإداري الذكي — للموظفين فقط</p></div><div id="status">جاري التحقق...</div></div><div class="card"><div class="quick"><button data-q="اعطني ملخص سريع عن حالة المركز اليوم">📊 ملخص المركز</button><button data-q="من هم الطلاب المتأخرون في سداد المدفوعات؟">💰 المتأخرون</button><button data-q="ابحث عن الطالب الذي سأذكر اسمه لك">👨‍🎓 البحث عن طالب</button><button data-q="ما الذي تستطيع مساعدتي فيه داخل نظام الأندلس؟">🤖 ماذا تستطيع؟</button></div></div><div class="card"><div id="messages" class="messages"><div class="msg system">مرحبًا بك في Andalus AI. هذه الصفحة متاحة لحسابات الموظفين المصرح لها فقط.</div></div><div id="err" class="err"></div><div class="composer"><textarea id="input" placeholder="اكتب سؤالك هنا..."></textarea><button id="send" class="send">إرسال ↵</button></div></div></div>
<script>
const SUPABASE_URL='https://uvwarprsghwvrfmdaaqv.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2d2FycHJzZ2h3dnJmbWRhYXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTgzNjQsImV4cCI6MjA5Njg3NDM2NH0.bPfXaNqmWUIM7pYU8rHfRtHNs6Z7fsZs2nf8-Vo5T7E';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);function add(t,c){const e=document.createElement('div');e.className='msg '+c;e.textContent=t;$('messages').appendChild(e);$('messages').scrollTop=$('messages').scrollHeight}function err(t){$('err').textContent=t;$('err').style.display='block'}
async function guard(){const {data,error}=await sb.auth.getSession();if(error||!data.session){location.href='./';return null}const r=await sb.rpc('is_admin');if(r.error||r.data!==true){document.body.innerHTML='<div style="font-family:Cairo;padding:60px;text-align:center"><h2>غير مصرح</h2><p>Andalus AI متاح لحسابات الموظفين المصرح لها فقط.</p><a href="./">العودة للنظام</a></div>';return null}$('status').textContent='متصل بحساب الموظف';return data.session}
async function ask(){const text=$('input').value.trim();if(!text)return;const s=await guard();if(!s)return;$('input').value='';$('err').style.display='none';add(text,'user');$('send').disabled=true;try{const r=await fetch(SUPABASE_URL+'/functions/v1/andalus-ai',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+s.access_token},body:JSON.stringify({message:text})});const d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'تعذر الاتصال بـ Andalus AI');add(String(d.answer||d.message||'لم تصل إجابة.'),'ai')}catch(e){err(e.message||'حدث خطأ')}finally{$('send').disabled=false;$('input').focus()}}
$('send').onclick=ask;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('input').value=b.dataset.q;$('input').focus()});guard();
</script></body></html>
