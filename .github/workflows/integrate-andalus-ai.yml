name: Integrate Andalus AI

on:
  push:
    branches:
      - feature/andalus-ai

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: integrate Andalus AI widget') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Andalus AI widget
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = '<!-- ANDALUS_AI_WIDGET_START -->'
          if marker in html:
              print('Andalus AI widget already integrated.')
              raise SystemExit(0)

          css = r'''
          /* ANDALUS AI WIDGET */
          #andalus-ai-fab{position:fixed;left:22px;bottom:22px;z-index:9998;border:0;border-radius:18px;padding:12px 16px;background:linear-gradient(135deg,#152238,#1f3562);color:#fff;font-family:Cairo,sans-serif;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(21,34,56,.28);display:flex;align-items:center;gap:8px;transition:.2s}
          #andalus-ai-fab:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(21,34,56,.34)}
          #andalus-ai-fab .ai-dot{width:9px;height:9px;border-radius:50%;background:#c9a24c;box-shadow:0 0 0 5px rgba(201,162,76,.13)}
          #andalus-ai-modal{display:none;position:fixed;inset:0;background:rgba(8,15,28,.52);z-index:9999;align-items:center;justify-content:center;padding:18px}
          #andalus-ai-modal.open{display:flex}
          .andalus-ai-box{width:min(760px,96vw);height:min(720px,90vh);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.28);display:flex;flex-direction:column}
          .andalus-ai-head{background:linear-gradient(135deg,#152238,#1f3562);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
          .andalus-ai-head h3{margin:0;font-size:17px;font-weight:900}.andalus-ai-head p{margin:3px 0 0;font-size:11px;color:rgba(255,255,255,.65)}
          .andalus-ai-close{border:0;background:rgba(255,255,255,.1);color:#fff;width:34px;height:34px;border-radius:9px;font-size:20px;cursor:pointer}
          .andalus-ai-quick{display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e4e8f2;background:#fafbfd}
          .andalus-ai-quick button{border:1px solid #e4e8f2;background:#fff;color:#152238;border-radius:20px;padding:6px 10px;font-family:Cairo,sans-serif;font-size:11px;font-weight:700;cursor:pointer}
          .andalus-ai-chat{flex:1;overflow:auto;padding:18px;background:#f3f5fa;display:flex;flex-direction:column;gap:10px}
          .andalus-ai-msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.8;font-size:13px;white-space:pre-wrap}
          .andalus-ai-msg.user{align-self:flex-start;background:#152238;color:#fff;border-bottom-left-radius:4px}.andalus-ai-msg.bot{align-self:flex-end;background:#fff;color:#1a2437;border:1px solid #e4e8f2;border-bottom-right-radius:4px}
          .andalus-ai-compose{padding:12px;border-top:1px solid #e4e8f2;background:#fff;display:flex;gap:8px}
          .andalus-ai-compose textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:1.5px solid #e4e8f2;border-radius:12px;padding:10px 12px;font-family:Cairo,sans-serif;font-size:13px;outline:none}.andalus-ai-compose textarea:focus{border-color:#152238}
          .andalus-ai-send{width:52px;border:0;border-radius:12px;background:#c9a24c;color:#152238;font-size:18px;font-weight:900;cursor:pointer}.andalus-ai-send:disabled{opacity:.5;cursor:not-allowed}
          @media(max-width:600px){#andalus-ai-fab{left:12px;bottom:12px}.andalus-ai-box{height:92vh}.andalus-ai-msg{max-width:94%}}
          '''

          body = r'''
          <!-- ANDALUS_AI_WIDGET_START -->
          <button id="andalus-ai-fab" type="button" onclick="openAndalusAI()" aria-label="Andalus AI"><span class="ai-dot"></span> 🧠 Andalus AI</button>
          <div id="andalus-ai-modal" onclick="if(event.target===this) closeAndalusAI()">
            <div class="andalus-ai-box" role="dialog" aria-modal="true" aria-label="Andalus AI">
              <div class="andalus-ai-head">
                <div><h3>🧠 Andalus AI</h3><p>مساعدك الذكي داخل نظام مركز الأندلس — قراءة وتحليل فقط</p></div>
                <button class="andalus-ai-close" type="button" onclick="closeAndalusAI()">×</button>
              </div>
              <div class="andalus-ai-quick">
                <button type="button" onclick="askAndalusAI('اعطني ملخص سريع عن المركز')">📊 ملخص المركز</button>
                <button type="button" onclick="askAndalusAI('مين الطلاب المتأخرين في السداد؟')">💰 المتأخرون في السداد</button>
                <button type="button" onclick="askAndalusAIFocus()">👤 ابحث عن طالب</button>
                <button type="button" onclick="askAndalusAI('ايه الحاجات اللي تقدر تساعدني فيها؟')">❓ ماذا تستطيع؟</button>
              </div>
              <div id="andalus-ai-chat" class="andalus-ai-chat">
                <div class="andalus-ai-msg bot">أهلاً بك 👋<br>أنا Andalus AI. اسألني عن الطلاب، الدرجات، الحضور، المدفوعات أو أرقام المركز.</div>
              </div>
              <div class="andalus-ai-compose">
                <textarea id="andalus-ai-input" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAndalusAI()}"></textarea>
                <button id="andalus-ai-send" class="andalus-ai-send" type="button" onclick="sendAndalusAI()">➤</button>
              </div>
            </div>
          </div>
          <script>
          (function(){
            let andalusAiBusy=false;
            function aiEl(id){return document.getElementById(id)}
            window.openAndalusAI=function(){aiEl('andalus-ai-modal').classList.add('open');setTimeout(()=>aiEl('andalus-ai-input').focus(),80)};
            window.closeAndalusAI=function(){aiEl('andalus-ai-modal').classList.remove('open')};
            function addAiMsg(text,type){const d=document.createElement('div');d.className='andalus-ai-msg '+type;d.textContent=text;const c=aiEl('andalus-ai-chat');c.appendChild(d);c.scrollTop=c.scrollHeight;return d}
            window.askAndalusAI=function(text){openAndalusAI();aiEl('andalus-ai-input').value=text;sendAndalusAI()};
            window.askAndalusAIFocus=function(){openAndalusAI();aiEl('andalus-ai-input').value='ابحث عن الطالب ';aiEl('andalus-ai-input').focus()};
            window.sendAndalusAI=async function(){
              if(andalusAiBusy)return;
              const input=aiEl('andalus-ai-input');const message=input.value.trim();if(!message)return;
              andalusAiBusy=true;input.value='';addAiMsg(message,'user');const loading=addAiMsg('جاري التحليل…','bot');
              const send=aiEl('andalus-ai-send');send.disabled=true;
              try{
                if(typeof sb==='undefined')throw new Error('تعذر الوصول لاتصال النظام.');
                const {data:{session}}=await sb.auth.getSession();
                if(!session?.access_token)throw new Error('جلسة الدخول انتهت. سجّل الدخول للنظام مرة أخرى.');
                const r=await fetch('https://uvwarprsghwvrfmdaaqv.supabase.co/functions/v1/andalus-ai',{method:'POST',headers:{'Content-Type':'application/json','apikey':typeof SUPABASE_KEY!=='undefined'?SUPABASE_KEY:'','Authorization':'Bearer '+session.access_token},body:JSON.stringify({message})});
                const data=await r.json();if(!r.ok)throw new Error(data?.error||'تعذر الحصول على إجابة.');
                loading.textContent=data.answer||'لم أتمكن من تكوين إجابة الآن.';
              }catch(e){loading.textContent='❌ '+(e?.message||'حدث خطأ غير متوقع.');}
              finally{andalusAiBusy=false;send.disabled=false;input.focus()}
            };
            document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAndalusAI()});
          })();
          </script>
          <!-- ANDALUS_AI_WIDGET_END -->
          '''

          if '</style>' not in html or '</body>' not in html:
              raise SystemExit('index.html markers not found')
          html = html.replace('</style>', css + '\n</style>', 1)
          html = html.replace('</body>', body + '\n</body>', 1)
          path.write_text(html, encoding='utf-8')
          print('Andalus AI widget injected successfully.')

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: integrate Andalus AI widget"
          git push
