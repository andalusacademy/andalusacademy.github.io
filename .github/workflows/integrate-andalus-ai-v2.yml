name: Integrate Andalus AI v2

on:
  push:
    branches: [feature/andalus-ai]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'chore: integrate Andalus AI widget') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject AI launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          if '<!-- ANDALUS_AI_LAUNCHER -->' in h:
              raise SystemExit(0)
          css='''\n/* ANDALUS AI LAUNCHER */\n#andalus-ai-launcher{position:fixed;left:22px;bottom:22px;z-index:9998;border:0;border-radius:18px;padding:12px 17px;background:linear-gradient(135deg,#152238,#1f3562);color:#fff;font-family:Cairo,sans-serif;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(21,34,56,.28)}\n#andalus-ai-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(8,15,28,.55);align-items:center;justify-content:center;padding:18px}\n#andalus-ai-overlay.open{display:flex}\n#andalus-ai-frame{width:min(900px,96vw);height:min(820px,94vh);border:0;border-radius:22px;background:#fff;box-shadow:0 25px 80px rgba(0,0,0,.3)}\n'''
          body='''\n<!-- ANDALUS_AI_LAUNCHER -->\n<button id="andalus-ai-launcher" onclick="openAndalusAI()">🧠 Andalus AI</button>\n<div id="andalus-ai-overlay" onclick="if(event.target===this)closeAndalusAI()"><iframe id="andalus-ai-frame" src="andalus-ai.html" title="Andalus AI"></iframe></div>\n<script>function openAndalusAI(){document.getElementById('andalus-ai-overlay').classList.add('open')}function closeAndalusAI(){document.getElementById('andalus-ai-overlay').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAndalusAI()})</script>\n'''
          h=h.replace('</style>',css+'\n</style>',1).replace('</body>',body+'\n</body>',1)
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: integrate Andalus AI widget"
          git push
