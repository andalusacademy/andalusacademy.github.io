name: Integrate Andalus AI v2

on:
  push:
    branches: [feature/andalus-ai]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean and place AI launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          # Remove every previous launcher block, including the first malformed one.
          h=re.sub(r'<!-- ANDALUS_AI_LAUNCHER -->.*?(?:<!-- /ANDALUS_AI_LAUNCHER -->|</script>)', '', h, flags=re.S)
          css='''
          /* ANDALUS AI LAUNCHER */
          #andalus-ai-launcher{position:fixed;left:22px;bottom:22px;z-index:9998;border:0;border-radius:18px;padding:12px 17px;background:linear-gradient(135deg,#152238,#1f3562);color:#fff;font-family:Cairo,sans-serif;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(21,34,56,.28)}
          #andalus-ai-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(8,15,28,.55);align-items:center;justify-content:center;padding:18px}
          #andalus-ai-overlay.open{display:flex}
          #andalus-ai-frame{width:min(900px,96vw);height:min(820px,94vh);border:0;border-radius:22px;background:#fff;box-shadow:0 25px 80px rgba(0,0,0,.3)}
          '''
          if '/* ANDALUS AI LAUNCHER */' not in h:
              pos=h.rfind('</style>')
              if pos<0: raise SystemExit('style closing tag not found')
              h=h[:pos]+css+'\n'+h[pos:]
          body='''
          <!-- ANDALUS_AI_LAUNCHER -->
          <button id="andalus-ai-launcher" type="button" onclick="openAndalusAI()">🧠 Andalus AI</button>
          <div id="andalus-ai-overlay" onclick="if(event.target===this)closeAndalusAI()"><iframe id="andalus-ai-frame" src="andalus-ai.html" title="Andalus AI"></iframe></div>
          <script>function openAndalusAI(){document.getElementById('andalus-ai-overlay').classList.add('open')}function closeAndalusAI(){document.getElementById('andalus-ai-overlay').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAndalusAI()})</script>
          <!-- /ANDALUS_AI_LAUNCHER -->
          '''
          pos=h.rfind('</body>')
          if pos<0: raise SystemExit('body closing tag not found')
          h=h[:pos]+body+'\n'+h[pos:]
          p.write_text(h,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: integrate Andalus AI widget"
          git push
