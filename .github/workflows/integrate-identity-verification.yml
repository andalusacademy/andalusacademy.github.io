name: Integrate Identity Verification Admin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Ensure identity verification admin script is loaded
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f identity-verification-admin.js
          if grep -q 'identity-verification-admin.js' index.html; then
            echo 'Identity verification admin script already integrated.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="identity-verification-admin.js"></script>'
          marker='</body>'
          if marker not in s:
              raise SystemExit('Could not find </body> in index.html')
          s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'andalus-automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate identity verification admin panel' || exit 0
          git push
