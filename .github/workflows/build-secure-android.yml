name: Build Andalus Academy Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-secure-wrapper/**'
      - '.github/workflows/build-secure-android.yml'
concurrency:
  group: andalus-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Bundle the current web portals and local runtime dependencies
        run: |
          set -euo pipefail
          WEB_DIR="android-secure-wrapper/app/src/main/assets/www"
          mkdir -p "$WEB_DIR/vendor"
          cp index.html manifest.json sw.js *.js "$WEB_DIR/"
          cp -R vendor assets "$WEB_DIR/"

          # Vendor the runtime libraries required by the bundled portal.
          # Versions are pinned so an identical source revision produces the same dependency set.
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js" -o "$WEB_DIR/vendor/supabase.min.js"
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" -o "$WEB_DIR/vendor/xlsx.full.min.js"
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" -o "$WEB_DIR/vendor/chart.umd.min.js"
          curl -fL --retry 3 "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" -o "$WEB_DIR/vendor/mammoth.browser.min.js"
          curl -fL --retry 3 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" -o "$WEB_DIR/vendor/pdf.min.js"
          curl -fL --retry 3 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" -o "$WEB_DIR/vendor/pdf.worker.min.js"

          # Rewrite CDN script references in the packaged copy only; GitHub Pages remains unchanged.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-secure-wrapper/app/src/main/assets/www")
          replacements = {
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2": "./vendor/supabase.min.js",
              "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js": "./vendor/xlsx.full.min.js",
              "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js": "./vendor/chart.umd.min.js",
              "https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js": "./vendor/mammoth.browser.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js": "./vendor/pdf.min.js",
          }
          for path in list(root.rglob("*.html")) + list(root.rglob("*.js")):
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
          PY

          test -s "$WEB_DIR/vendor/supabase.min.js"
          test -s "$WEB_DIR/vendor/xlsx.full.min.js"
          test -s "$WEB_DIR/vendor/chart.umd.min.js"
          test -s "$WEB_DIR/vendor/mammoth.browser.min.js"
          test -s "$WEB_DIR/vendor/pdf.min.js"
          test -s "$WEB_DIR/vendor/pdf.worker.min.js"
          echo "Bundled local runtime libraries:"
          du -h "$WEB_DIR"/vendor/*.min.js
      - name: Build debug APK and AAB
        working-directory: android-secure-wrapper
        run: gradle --no-daemon assembleDebug bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: andalus-academy-android-debug
          path: |
            android-secure-wrapper/app/build/outputs/apk/debug/app-debug.apk
            android-secure-wrapper/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; debug artifacts were built."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/andalus-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK and AAB
        if: steps.signing.outputs.release_ready == 'true'
        working-directory: android-secure-wrapper
        run: gradle --no-daemon assembleRelease bundleRelease
      - name: Upload signed release artifacts
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: andalus-academy-android-release
          path: |
            android-secure-wrapper/app/build/outputs/apk/release/app-release.apk
            android-secure-wrapper/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
